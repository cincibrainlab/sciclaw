services:
  # ─────────────────────────────────────────────
  # sciClaw Agent (one-shot query)
  #   docker compose run --rm sciclaw-agent -m "Hello"
  # ─────────────────────────────────────────────
  sciclaw-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sciclaw-agent
    profiles:
      - agent
    volumes:
      - ./config/config.json:/root/sciclaw/config.json:ro
      - sciclaw-profile:/root/sciclaw/profile
      - sciclaw-global-skills:/root/sciclaw/skills
      - sciclaw-templates:/root/sciclaw/templates
      - sciclaw-backups:/root/sciclaw/backups
      - sciclaw-addons:/root/sciclaw/addons
      - sciclaw-workspace:/root/sciclaw/workspaces/default
      - sciclaw-state:/root/.sciclaw
    entrypoint: ["sciclaw", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # sciClaw Gateway (Long-running Bot)
  #   docker compose up sciclaw-gateway
  # ─────────────────────────────────────────────
  sciclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sciclaw-gateway
    restart: unless-stopped
    profiles:
      - gateway
    volumes:
      # Configuration file
      - ./config/config.json:/root/sciclaw/config.json:ro
      - sciclaw-profile:/root/sciclaw/profile
      - sciclaw-global-skills:/root/sciclaw/skills
      - sciclaw-templates:/root/sciclaw/templates
      - sciclaw-backups:/root/sciclaw/backups
      - sciclaw-addons:/root/sciclaw/addons
      # Persistent user workspace and separate machine-managed state
      - sciclaw-workspace:/root/sciclaw/workspaces/default
      - sciclaw-state:/root/.sciclaw
    command: ["gateway"]

volumes:
  sciclaw-profile:
  sciclaw-global-skills:
  sciclaw-templates:
  sciclaw-backups:
  sciclaw-addons:
  sciclaw-workspace:
  sciclaw-state:
