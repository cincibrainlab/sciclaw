services:
  sciclaw-mcp-server:
    build:
      context: ./tools/gitea-mcp
    restart: unless-stopped
    env_file: ${SCICLAW_MCP_SERVER_ENV_PATH:?set SCICLAW_MCP_SERVER_ENV_PATH}
    environment:
      MCP_MODE: http
      GITEA_HOST: ${GITEA_HOST:?set GITEA_HOST}
      GITEA_TOOLS: create_organization,issue_read,project_read,project_write,get_file_contents,create_or_update_file,pull_request_write
      SSL_CERT_FILE: /certs/CCHMCRootCA.pem
    volumes:
      - ${SCICLAW_MCP_CA_PATH:?set SCICLAW_MCP_CA_PATH}:/certs/CCHMCRootCA.pem:ro

  sciclaw-gateway:
    depends_on:
      sciclaw-mcp-server:
        condition: service_healthy
    volumes:
      - ${SCICLAW_CONFIG_PATH:?set SCICLAW_CONFIG_PATH}:/root/.picoclaw/config.json:ro
    environment:
      SCICLAW_MCP_URL: http://sciclaw-mcp-server:8080/mcp
